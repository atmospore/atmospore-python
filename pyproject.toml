[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atmospore"
version = "0.1.0"
description = "Async Python client for the Atmospore pollen forecast API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Atmospore" }]
keywords = ["pollen", "allergy", "weather", "atmospore", "forecast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7.6",
]

[project.urls]
Homepage = "https://atmospore.com"
Documentation = "https://atmospore.com/api-docs"
Repository = "https://github.com/atmospore/atmospore-python"
Issues = "https://github.com/atmospore/atmospore-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["atmospore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
